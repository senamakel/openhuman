---
# CI Fast — PRs by tinyhumansai org members run the full lane flow on the
# EX63 Firecracker microVM runners (runner group `openhuman-ex63`).
#
# Why pull_request_target: a pull_request_target run always uses THIS file
# from the base branch, never the PR's copy, so a PR cannot edit the routing
# gate below. The runner group is restricted to this workflow (and
# ci-lanes.yml) at refs/heads/main, so a fork's own `pull_request` workflow
# cannot claim these runners even if it names their label.
#
# The gate job never checks out or runs PR code. Only the lanes job does, and
# only for org members; it has a read-only token and no secrets. Everyone else
# runs the same lanes on GitHub-hosted runners via ci-fast-hosted.yml.
#
# Draft PRs never take the EX63, even a member's: they run on GitHub-hosted
# runners like an outsider's. Marking the PR ready for review re-runs this
# workflow, which then routes it to the EX63.
name: CI Fast

on:
  pull_request_target:
    branches: [main, release]
    types: [opened, synchronize, reopened, ready_for_review]
  # Testing workflow changes before they merge: dispatch this file from a
  # branch of THIS repository (`gh workflow run ci-fast.yml --ref <branch>`).
  # EX63 only admits it while that branch's ci-fast.yml and ci-lanes.yml are
  # on the runner group's allowlist, which is temporary; only the dispatching
  # actor's membership is checked, since there is no PR author.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Route (org members → EX63)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      member: ${{ steps.member.outputs.member }}
    steps:
      - name: Decide whether the author and pusher are org members
        id: member
        env:
          ORG: ${{ github.repository_owner }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          DRAFT: ${{ github.event.pull_request.draft }}
          # Optional fine-grained token with only Organization → Members: Read.
          # Without it, private members may be reported as non-members and
          # simply run on GitHub-hosted runners instead.
          MEMBERSHIP_TOKEN: ${{ secrets.CI_MEMBERSHIP_TOKEN }}
        run: |
          set -euo pipefail
          is_member() {
            local login="$1" code
            if [ -n "${MEMBERSHIP_TOKEN}" ]; then
              code="$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${MEMBERSHIP_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/orgs/${ORG}/members/${login}")"
              [ "${code}" = "204" ]
              return
            fi
            # No token: only the PR author's association is available.
            [ "${login}" = "${AUTHOR}" ] && { [ "${ASSOCIATION}" = "OWNER" ] || [ "${ASSOCIATION}" = "MEMBER" ]; }
          }
          member=false
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            # No PR author: the dispatcher, who already needs write access,
            # must be an org member. Without the membership token that cannot
            # be checked, so a dispatch then stays off EX63.
            AUTHOR="${ACTOR}"
            if [ -n "${MEMBERSHIP_TOKEN}" ] && is_member "${ACTOR}"; then
              member=true
            fi
          elif [ "${DRAFT:-false}" = "true" ]; then
            # Drafts stay off the EX63 and run on GitHub-hosted runners.
            echo "[ci][route] draft PR: GitHub-hosted runners"
          elif is_member "${AUTHOR}" && is_member "${ACTOR}"; then
            member=true
          fi
          echo "[ci][route] author=${AUTHOR} actor=${ACTOR} association=${ASSOCIATION} draft=${DRAFT:-false} token=$([ -n "${MEMBERSHIP_TOKEN}" ] && echo yes || echo no) member=${member}"
          echo "member=${member}" >> "$GITHUB_OUTPUT"

  lanes:
    name: Lanes
    needs: route
    if: needs.route.outputs.member == 'true'
    uses: ./.github/workflows/ci-lanes.yml
    with:
      profile: ex63
      pr-number: ${{ github.event.pull_request.number || 0 }}
      base-ref: ${{ github.base_ref || 'main' }}
      ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
