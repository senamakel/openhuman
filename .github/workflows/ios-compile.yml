---
name: iOS Compile Sanity

on:
  pull_request:
    paths:
      - 'app/src-tauri/**'
      - 'packages/tauri-plugin-ptt/**'
      - 'src/openhuman/devices/**'
      - 'app/src/services/transport/**'
      - 'app/src/lib/tunnel/**'
      - 'app/src/pages/ios/**'
      - '.github/workflows/ios-compile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ios-compile:
    name: iOS Compile Check
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.0'
          targets: aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
            packages/tauri-plugin-ptt -> target
          cache-on-failure: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hard gate: host-target check for the desktop Tauri shell.
      # This catches Rust API breakage introduced by iOS cfg-gates without
      # needing a full iOS toolchain.
      - name: cargo check -- Tauri shell (host target)
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      # Soft gate: iOS-target check for the Tauri shell.
      # Third-party C deps (cef-dll-sys, etc.) may fail without a full Xcode
      # installation. We accept these failures as known limitations of the
      # macos-latest runner until we pin an Xcode version with all deps.
      # Failures produce a warning in the workflow summary but do not block merge.
      - name: cargo check -- Tauri shell (aarch64-apple-ios) [soft]
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --target aarch64-apple-ios
        continue-on-error: true

      # Hard gate: PTT plugin (pure Swift + Rust, no CEF dep).
      - name: cargo check -- tauri-plugin-ptt
        run: cargo check --manifest-path packages/tauri-plugin-ptt/Cargo.toml

      # Hard gate: TypeScript compile.
      - name: pnpm compile
        run: pnpm --dir app compile

      # Hard gate: iOS-relevant Vitest suites.
      # Runs tests matching transport, tunnel, devices, ios, or mascot paths.
      - name: pnpm test (iOS suites)
        run: >
          pnpm --dir app test --
          src/services/transport
          src/lib/tunnel
          src/pages/ios
          src/components/settings/panels/devices
