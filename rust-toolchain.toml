[toolchain]
# Rust 1.94 is required by rusqlite 0.40 / libsqlite3-sys 0.38 (they use the
# `cfg_select!` macro stabilized in 1.94), letting us drop the vendored copies
# that previously backported it to `#[cfg]`. The former "pin below 1.94" existed
# only for matrix-sdk's async recursion overflow (matrix-rust-sdk#6254); the
# `channel-matrix` feature and its matrix-sdk dependency have since been removed.
channel = "1.94.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
