id = "researcher"
display_name = "Researcher"
delegate_name = "research"
when_to_use = "Multi-source web research in a separate context: crawls, comparisons, deep digests. One fact or one page is `web_search_tool` / `web_fetch` directly."
temperature = 0.4
max_iterations = 10
iteration_policy = "extended"
max_turn_output_tokens = 4096
max_result_chars = 8000
sandbox_mode = "none"
omit_identity = true
omit_memory_context = true
omit_safety_preamble = true
# No eager memory pre-fetch. The researcher is a pure-function web/docs
# specialist with `omit_memory_context = true`; the orchestrator passes it
# the focused task to research, so it never needed the memory-tree walk.

[model]
hint = "burst"

[tools]
named = [
    # Keep the default researcher narrow: search to locate sources, a grounded
    # answer for a cited summary, contents/fetch to read selected pages.
    # Market, filesystem, and general HTTP/curl tools belong to more specific
    # agents so simple research tasks don't expand into open-ended search loops.
    "web_search_tool",
    "web_answer_tool",
    "web_contents_tool",
    "web_fetch",
]
