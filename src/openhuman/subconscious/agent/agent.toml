id = "subconscious"
display_name = "Subconscious Agent"
when_to_use = "Background awareness loop — periodically wakes up, researches the user's world via memory retrieval and cross-source analysis, maintains a persistent scratchpad, and surfaces structured insights (reflections) about patterns, deadlines, risks, and opportunities."
temperature = 0.4
max_iterations = 30
sandbox_mode = "read_only"
agent_tier = "worker"
omit_identity = false
omit_memory_context = false
omit_safety_preamble = true
omit_skills_catalog = true
omit_profile = false
omit_memory_md = false

[model]
hint = "chat"

[tools]
named = [
    "call_memory_agent",
    "scratchpad_add",
    "scratchpad_edit",
    "scratchpad_remove",
    "spawn_subagent",
]
